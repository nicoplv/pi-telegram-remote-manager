telegram:
  botToken: ${TELEGRAM_BOT_TOKEN}

projectsRoot: /home/user/projects
dataDir: /home/user/.pi-telegram-remote-manager

pi:
  executable: pi

tmux:
  executable: tmux

sessions:
  idleTimeoutMinutes: 10
  bridgeRegistrationTimeoutSeconds: 20

render:
  tools: brief
  thinking: brief
  streamIntervalMs: 1000

bridge:
  transport: unix-socket
